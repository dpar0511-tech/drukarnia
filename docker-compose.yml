services:
  pgsql:
    image: postgres:16
    container_name: drukarnia-postgres
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'drukarnia-pgsql:/var/lib/postgresql/data'
    networks:
      - drukarnia-network
    healthcheck:
      test:
        - CMD
        - pg_isready
        - '-q'
        - '-d'
        - '${DB_DATABASE}'
        - '-U'
        - '${DB_USERNAME}'
      retries: 3
      timeout: 5s

  redis:
    image: redis:alpine
    container_name: drukarnia-redis
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'drukarnia-redis:/data'
    networks:
      - drukarnia-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      retries: 3
      timeout: 5s

  minio:
    image: minio/minio:latest
    container_name: drukarnia-minio
    ports:
      - '${FORWARD_MINIO_PORT:-9000}:9000'
      - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
    environment:
      MINIO_ROOT_USER: '${AWS_ACCESS_KEY_ID}'
      MINIO_ROOT_PASSWORD: '${AWS_SECRET_ACCESS_KEY}'
    command: server /data --console-address ":8900"
    volumes:
      - 'drukarnia-minio:/data'
    networks:
      - drukarnia-network
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - 'http://localhost:9000/minio/health/live'
      retries: 3
      timeout: 5s

  meilisearch:
    image: 'getmeili/meilisearch:latest'
    container_name: drukarnia-meilisearch
    ports:
      - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
    environment:
      MEILI_MASTER_KEY: '${MEILISEARCH_KEY}'
    volumes:
      - 'drukarnia-meilisearch:/meili_data'
    networks:
      - drukarnia-network
    healthcheck:
      test:
        - CMD
        - wget
        - '--no-verbose'
        - '--spider'
        - 'http://localhost:7700/health'
      retries: 3
      timeout: 5s

  minio-setup:
    image: minio/mc
    container_name: drukarnia-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - drukarnia-network
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY};
      /usr/bin/mc mb myminio/drukarnia-files --ignore-existing;
      /usr/bin/mc anonymous set private myminio/drukarnia-files;
      exit 0;
      "

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: drukarnia-app
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
    networks:
      - drukarnia-network
    depends_on:
      - pgsql
      - redis
      - minio

  nginx:
    image: nginx:alpine
    container_name: drukarnia-nginx
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - drukarnia-network
    depends_on:
      - app

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: drukarnia-horizon
    command: php artisan horizon
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
    networks:
      - drukarnia-network
    depends_on:
      - pgsql
      - redis

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: drukarnia-reverb
    command: php artisan reverb:start --host="0.0.0.0" --port=8080
    ports:
      - '${FORWARD_REVERB_PORT:-8080}:8080'
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
    networks:
      - drukarnia-network
    depends_on:
      - pgsql
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: drukarnia-scheduler
    command: php artisan schedule:work
    volumes:
      - ./:/var/www/html
    environment:
      DB_HOST: pgsql
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      MEILISEARCH_HOST: http://meilisearch:7700
    networks:
      - drukarnia-network
    depends_on:
      - pgsql
      - redis
      - minio

networks:
  drukarnia-network:
    driver: bridge

volumes:
  drukarnia-pgsql:
    driver: local
  drukarnia-redis:
    driver: local
  drukarnia-minio:
    driver: local
  drukarnia-meilisearch:
    driver: local
